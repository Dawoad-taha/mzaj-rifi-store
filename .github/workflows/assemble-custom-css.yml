name: Assemble exact custom CSS

on:
  push:
    paths:
      - 'tmp-mzaj-upload/css-exact/chunk-009.part'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble exact CSS source
        run: cat tmp-mzaj-upload/css-exact/chunk-*.part | base64 -d > css/custom.css
      - name: Commit assembled CSS
        run: |
          if git diff --quiet -- css/custom.css; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/custom.css
          git commit -m "Replace custom CSS with exact uploaded source"
          git push
